[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kde-vscode-jumplist"
version = "0.1.0"
description = "Dynamic KDE Plasma task manager jump lists for VS Code recent files, folders and remotes"
readme = "README.md"
license = { text = "Apache-2.0" }
# 3.11 is the floor the code is written against (`tomllib` in the test suite, and
# the type-parameter syntax used throughout).
requires-python = ">=3.11"
authors = [{ name = "alexzhc" }]
keywords = ["kde", "plasma", "vscode", "jump-list", "task-manager", "pinned"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: K Desktop Environment",
]
dependencies = ["tabulate>=0.9"]

[project.urls]
Homepage = "https://github.com/alexzhc/kde-vscode-jumplist"

[project.optional-dependencies]
dev = ["pytest>=8"]
# The `manage` dialog. Deliberately not a runtime dependency: every other
# command works without it, and the dialog reports what is missing rather than
# failing, so only users who want it need to install Qt.
#
# PyQt6 rather than a KDE Frameworks binding because there is no KF6 binding for
# Python. With the KDE platform theme loaded, PyQt6 draws the Breeze style and
# resolves the theme's icons -- the same names the jump list uses -- which is
# what makes the window look like the rest of the desktop. Qt's own
# ExtendedSelection is also the usual click/Ctrl/Shift behaviour, which GTK 3
# does not have.
qt = ["PyQt6>=6.5"]

[project.scripts]
kde-vscode-jumplist = "kde_vscode_jumplist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Let pytest find the src layout itself, so `pytest` works without PYTHONPATH.
pythonpath = ["src"]
