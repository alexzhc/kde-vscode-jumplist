# The values every setting starts from, used by the Settings window's
# "Restore Defaults" button.
#
# This is a file rather than a table of constants in the code so that there is
# one description of what a fresh installation looks like, in the same language
# as the configuration itself. It must name every setting: a missing one would
# mean Restore Defaults silently left that setting alone, and a test checks it
# against the list the parser knows.
#
# It is also the file the project's own config.toml started as -- the README
# shows the same values -- so a new user's first config.toml is what this says.

# Directory holding this tool's own files: pinned.json, entries.json and
# sync.lock.
data_dir = "~/.config/kde-vscode-jumplist"

# Directory the generated .desktop file is written to (Plasma reads it there).
apps_dir = "~/.local/share/applications"

# VS Code user data directory -- the one holding User/globalStorage/state.vscdb.
# An empty string means "detect every installation".
vscode_dir = ""

# Exact files, for unusual layouts. Each one wins over the directory settings
# above; an empty string means "detect".
state_db = ""   # the profile database itself
shared_db = ""  # the shared database, ~/.vscode-shared/sharedStorage/state.vscdb
desktop = ""    # the vendor .desktop file to copy and extend
exec = ""       # the executable to open entries with

# Recent entries listed in the menu, newest first. 0 lists no recents at all.
max_recents = 10

# Entry kinds left out of the recents list: "folder", "file" or "workspace".
# An empty list keeps every kind. Pinned entries are never filtered.
exclude_kinds = ["workspace"]

# Which block comes first: "above" (pinned entries first) or "below" (recents).
pinned_position = "above"
